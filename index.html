const KEY = 'tcr115:pw';
const u8 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function open(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(P.salt), iterations: P.iter, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.data));
  return new TextDecoder().decode(buf);
}
function show(html) { document.open(); document.write(html); document.close(); }
const lock = document.getElementById('lock'), f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
f.onsubmit = async e => {
  e.preventDefault();
  const pw = document.getElementById('pw').value;
  go.disabled = true; go.textContent = '解鎖中…'; err.textContent = ''; f.classList.remove('bad');
  try {
    const html = await open(pw);
    if (document.getElementById('rem').checked) localStorage.setItem(KEY, pw); else localStorage.removeItem(KEY);
    show(html);
  } catch {
    f.classList.add('bad'); err.textContent = '密碼不對，請再試一次';
    go.disabled = false; go.textContent = '進入';
  }
};
const saved = localStorage.getItem(KEY);
if (saved) open(saved).then(show, () => { localStorage.removeItem(KEY); lock.hidden = false; });
else lock.hidden = false;
</script>
</body>
</html>
